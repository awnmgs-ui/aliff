<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aliff - آلیف</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, sans-serif;

    background:
        linear-gradient(
            135deg,
            #667eea 0%,
            #764ba2 100%
        );

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {
    background: white;

    width: 100%;
    max-width: 500px;

    padding: 40px 30px;

    border-radius: 20px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,.3);

    animation: slideUp .6s ease-out;
}

@keyframes slideUp {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.profile-image {
    width: 140px;
    height: 140px;

    border-radius: 50%;

    object-fit: cover;

    border: 5px solid #667eea;

    margin-bottom: 25px;

    box-shadow:
        0 10px 25px rgba(102,126,234,.3);

    animation: pulse 2s infinite;
}

@keyframes pulse {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }

}

h1 {
    color: #667eea;

    font-size: 2.5em;

    margin-bottom: 10px;
}

.tagline {
    color: #666;

    font-size: 1.1em;

    margin-bottom: 30px;

    font-style: italic;
}

.divider {
    height: 2px;

    margin: 25px 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #667eea,
            transparent
        );
}

.animation-btn {
    border: none;

    color: white;

    cursor: pointer;

    padding: 15px 30px;

    border-radius: 12px;

    font-size: 1em;

    font-weight: 600;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    box-shadow:
        0 5px 15px rgba(102,126,234,.4);

    transition: .3s;
}

.animation-btn:hover {
    transform: translateY(-4px);
}


/* =========================
   SOCIAL LINKS
========================= */

.social-links {
    display: flex;

    justify-content: center;

    gap: 18px;

    margin-top: 30px;
}

.social-link {
    width: 60px;
    height: 60px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    text-decoration: none;

    transition: .3s;

    box-shadow:
        0 6px 18px rgba(0,0,0,.2);
}

.social-link:hover {
    transform: translateY(-5px) scale(1.08);
}

.social-link svg {
    width: 30px;
    height: 30px;

    fill: white;
}


/* Instagram */

.instagram {
    background:
        linear-gradient(
            135deg,
            #833ab4,
            #fd1d1d,
            #fcb045
        );
}


/* Telegram */

.telegram {
    background: #229ED9;
}


.footer {
    margin-top: 20px;

    color: #999;

    font-size: .85em;
}


/* =========================
   MODAL
========================= */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background:
        rgba(0,0,0,.94);

    z-index: 1000;

    align-items: center;
    justify-content: center;
}

.modal.active {
    display: flex;
}

.modal-content {

    position: relative;

    width: 92%;

    max-width: 650px;

    height: 550px;

    background:
        radial-gradient(
            circle at center,
            #101b2b,
            #020408 70%
        );

    border-radius: 20px;

    border: 2px solid #00d4ff;

    box-shadow:
        0 0 40px rgba(0,212,255,.35);

    overflow: hidden;
}

#flowerCanvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
}

.close-btn {

    position: absolute;

    top: 15px;
    right: 15px;

    z-index: 10;

    background:
        rgba(0,0,0,.8);

    color: #00d4ff;

    border:
        2px solid #00d4ff;

    border-radius: 10px;

    padding: 8px 15px;

    cursor: pointer;

    font-size: 18px;
}

@media(max-width:600px) {

    .container {
        padding: 30px 20px;
    }

    h1 {
        font-size: 2em;
    }

    .profile-image {
        width: 120px;
        height: 120px;
    }

    .modal-content {
        width: 95%;
        height: 430px;
    }

}

</style>
</head>


<body>


<div class="container">

    <img
        src="https://i.postimg.cc/jqhq8XPx/file-000000005334820da133a5c189871003.png"
        class="profile-image"
        alt="Aliff"
    >

    <h1>Aliff</h1>

    <p class="tagline">
        من هستم. همه چیز ساده است.
    </p>

    <div class="divider"></div>


    <button
        class="animation-btn"
        onclick="openAnimation()"
    >
        🌸 دیدن انیمیشن گل
    </button>


    <div class="social-links">


        <!-- Instagram -->

        <a
            href="https://instagram.com/5fxf_a"
            target="_blank"
            rel="noopener noreferrer"
            class="social-link instagram"
            aria-label="Instagram"
        >

            <svg
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
            >

                <path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9z"/>

                <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>

                <circle
                    cx="17.5"
                    cy="6.5"
                    r="1.2"
                />

            </svg>

        </a>


        <!-- Telegram -->

        <a
            href="https://t.me/Author_ffG"
            target="_blank"
            rel="noopener noreferrer"
            class="social-link telegram"
            aria-label="Telegram"
        >

            <svg
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
            >

                <path d="M21.5 3.5 2.9 10.7c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.1.9.7.9.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.6.3 1.8-.8l3.1-15.1c.3-1.4-.5-2-1.5-1.6zM8.2 13.4l10.9-6.9c.5-.3 1-.1.6.2l-8.9 8-0.3 3.4-1.5-4.7-0.8-.0z"/>

            </svg>

        </a>

    </div>


    <div class="footer">
        ✨ ساخته شده با ❤️ و سادگی
    </div>

</div>


<!-- =========================
     FLOWER MODAL
========================= -->

<div
    id="animationModal"
    class="modal"
>

    <div class="modal-content">

        <button
            class="close-btn"
            onclick="closeAnimation()"
        >
            ✕
        </button>

        <canvas id="flowerCanvas"></canvas>

    </div>

</div>


<script>

/* ==================================================
   تنظیمات اصلی
================================================== */

const modal =
    document.getElementById(
        "animationModal"
    );

const canvas =
    document.getElementById(
        "flowerCanvas"
    );

const ctx =
    canvas.getContext("2d");

let animationId = null;

let frame = 0;

let running = false;


/* ==================================================
   رنگ گلبرگ‌ها
================================================== */

const petalColors = [

    ["#ff1744", "#ff8a80"],

    ["#ff6d00", "#ffb74d"],

    ["#ffc400", "#fff176"],

    ["#76ff03", "#b9f6ca"],

    ["#00e676", "#69f0ae"],

    ["#00e5ff", "#80deea"],

    ["#2979ff", "#82b1ff"],

    ["#7c4dff", "#b388ff"]

];


/* ==================================================
   اندازه Canvas
================================================== */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


/* ==================================================
   باز کردن گل
================================================== */

function openAnimation() {

    modal.classList.add("active");

    requestAnimationFrame(() => {

        resizeCanvas();

        startFlower();

    });
}


/* ==================================================
   بستن گل
================================================== */

function closeAnimation() {

    running = false;

    modal.classList.remove("active");

    if (animationId !== null) {

        cancelAnimationFrame(
            animationId
        );

        animationId = null;
    }
}


/* ==================================================
   تابع easing
================================================== */

function easeOut(t) {

    return 1 -
        Math.pow(
            1 - t,
            3
        );
}


/* ==================================================
   رسم گلبرگ
================================================== */

function drawPetal(
    cx,
    cy,
    angle,
    length,
    width,
    progress,
    colors
) {

    if (progress <= 0)
        return;


    const p =
        easeOut(
            Math.min(
                progress,
                1
            )
        );


    const L =
        length * p;


    const bend =
        Math.sin(
            p * Math.PI
        ) * 45;


    const dx =
        Math.cos(angle);

    const dy =
        Math.sin(angle);


    const tipX =
        cx +
        dx * L +
        Math.cos(
            angle + Math.PI / 2
        ) * bend;


    const tipY =
        cy +
        dy * L +
        Math.sin(
            angle + Math.PI / 2
        ) * bend;


    const px =
        -Math.sin(angle);

    const py =
        Math.cos(angle);


    const W =
        width * p;


    const leftX =
        cx +
        px * W * .12;

    const leftY =
        cy +
        py * W * .12;


    const rightX =
        cx -
        px * W * .12;

    const rightY =
        cy -
        py * W * .12;


    const midX =
        cx +
        dx * L * .52;

    const midY =
        cy +
        dy * L * .52;


    const sideX =
        px *
        W *
        .55;


    const sideY =
        py *
        W *
        .55;


    const gradient =
        ctx.createLinearGradient(
            cx,
            cy,
            tipX,
            tipY
        );


    gradient.addColorStop(
        0,
        colors[0]
    );

    gradient.addColorStop(
        .35,
        colors[1]
    );

    gradient.addColorStop(
        .7,
        colors[0]
    );

    gradient.addColorStop(
        1,
        "#180018"
    );


    ctx.beginPath();

    ctx.moveTo(
        leftX,
        leftY
    );


    ctx.bezierCurveTo(

        midX + sideX,
        midY + sideY,

        tipX + px * W * .15,
        tipY + py * W * .15,

        tipX,
        tipY
    );


    ctx.bezierCurveTo(

        tipX - px * W * .15,
        tipY - py * W * .15,

        midX - sideX,
        midY - sideY,

        rightX,
        rightY
    );


    ctx.quadraticCurveTo(
        cx,
        cy,
        leftX,
        leftY
    );


    ctx.closePath();


    ctx.shadowBlur =
        18 * p;

    ctx.shadowColor =
        colors[0];


    ctx.fillStyle =
        gradient;

    ctx.fill();


    ctx.shadowBlur = 0;


    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy
    );

    ctx.quadraticCurveTo(

        midX +
        px * W * .25,

        midY +
        py * W * .25,

        tipX,
        tipY
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.45)";

    ctx.lineWidth =
        Math.max(
            1,
            2 * p
        );

    ctx.stroke();


    for (
        let vein = 1;
        vein <= 4;
        vein++
    ) {

        const vp =
            vein / 5;


        const vx =
            cx +
            (tipX - cx) *
            vp;


        const vy =
            cy +
            (tipY - cy) *
            vp;


        ctx.beginPath();


        ctx.moveTo(
            vx,
            vy
        );


        ctx.lineTo(
            vx +
            px * W * .25,

            vy +
            py * W * .25
        );


        ctx.strokeStyle =
            "rgba(255,255,255,.16)";


        ctx.lineWidth = .8;


        ctx.stroke();

    }

}


/* ==================================================
   مرکز گل
================================================== */

function drawCenter(
    cx,
    cy,
    progress
) {

    const p =
        easeOut(
            Math.min(
                progress,
                1
            )
        );


    const radius =
        10 +
        p * 15;


    const glow =
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            radius * 3
        );


    glow.addColorStop(
        0,
        "#ffffff"
    );

    glow.addColorStop(
        .15,
        "#fff700"
    );

    glow.addColorStop(
        .4,
        "rgba(255,140,0,.7)"
    );

    glow.addColorStop(
        1,
        "rgba(255,50,0,0)"
    );


    ctx.fillStyle =
        glow;


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius * 3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    for (
        let i = 0;
        i < 28;
        i++
    ) {

        const a =
            i *
            Math.PI *
            2 /
            28;


        const r =
            radius *
            .55;


        const x =
            cx +
            Math.cos(a) *
            r;


        const y =
            cy +
            Math.sin(a) *
            r;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2.2,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            i % 2 === 0
            ? "#ffd600"
            : "#ff9100";


        ctx.fill();

    }

}


/* ==================================================
   شروع انیمیشن
================================================== */

function startFlower() {

    if (running)
        return;


    running = true;

    frame = 0;


    function animate() {

        if (
            !running ||
            !modal.classList.contains(
                "active"
            )
        ) {

            animationId = null;

            return;
        }


        const rect =
            canvas.getBoundingClientRect();


        const cw =
            rect.width;

        const ch =
            rect.height;


        const cx =
            cw / 2;

        const cy =
            ch / 2;


        const dpr =
            window.devicePixelRatio || 1;


        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );


        ctx.clearRect(
            0,
            0,
            cw,
            ch
        );


        const bg =
            ctx.createRadialGradient(
                cx,
                cy,
                0,
                cx,
                cy,
                Math.max(cw,ch) * .7
            );


        bg.addColorStop(
            0,
            "#101d32"
        );

        bg.addColorStop(
            .5,
            "#050b15"
        );

        bg.addColorStop(
            1,
            "#000000"
        );


        ctx.fillStyle =
            bg;


        ctx.fillRect(
            0,
            0,
            cw,
            ch
        );


        const petalCount = 8;


        const length =
            Math.min(
                cw,
                ch
            ) * .34;


        const width =
            Math.min(
                cw,
                ch
            ) * .20;


        for (
            let i = 0;
            i < petalCount;
            i++
        ) {

            const delay =
                i * 22;


            const progress =
                (
                    frame -
                    delay
                ) / 65;


            const angle =
                i *
                Math.PI *
                2 /
                petalCount
                +
                Math.sin(
                    frame * .004
                ) * .04;


            drawPetal(

                cx,
                cy,

                angle,

                length,

                width,

                Math.max(
                    0,
                    progress
                ),

                petalColors[i]

            );

        }


        const centerProgress =
            Math.max(
                0,
                (frame - 150) / 40
            );


        drawCenter(
            cx,
            cy,
            centerProgress
        );


        if (frame > 150) {

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                const a =
                    i * .9 +
                    frame * .002;


                const r =
                    length *
                    (
                        1.15 +
                        Math.sin(
                            frame * .01 +
                            i
                        ) * .08
                    );


                const x =
                    cx +
                    Math.cos(a) *
                    r;


                const y =
                    cy +
                    Math.sin(a) *
                    r;


                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    1.3,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    "rgba(255,255,255,.55)";


                ctx.fill();

            }

        }


        frame++;


        animationId =
            requestAnimationFrame(
                animate
            );

    }


    animate();

}


/* ==================================================
   کلیک بیرون Modal
================================================== */

modal.addEventListener(
    "click",
    function(e) {

        if (
            e.target === modal
        ) {

            closeAnimation();

        }

    }
);


/* ==================================================
   Escape
================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape" &&
            modal.classList.contains(
                "active"
            )
        ) {

            closeAnimation();

        }

    }
);


/* ==================================================
   تغییر اندازه
================================================== */

window.addEventListener(
    "resize",
    function() {

        if (
            modal.classList.contains(
                "active"
            )
        ) {

            resizeCanvas();

        }

    }
);

</script>

</body>
