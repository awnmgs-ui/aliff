#flowerCanvas {

    inset: 0;

.flower-modal .modal-content {

@media(max-width:600px) {

    }
}

<!-- THREE.JS -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =========================
   ROBOT
========================= */

const robotModal =
    document.getElementById("robotModal");

const robotCanvas =
    document.getElementById("robotCanvas");

const robotStatus =
    document.getElementById("robotStatus");

let robotScene;
let robotCamera;
let robotRenderer;
let robotControls;
let robotModel;
let robotMixer;
let robotClock;

let robotAnimationId = null;


/* =========================
   باز کردن ربات
========================= */

window.openRobot = function() {

    robotModal.classList.add("active");

    if (!robotRenderer) {
        initRobot();
    }

};


/* =========================
   بستن ربات
========================= */

window.closeRobot = function() {

    robotModal.classList.remove("active");

    if (robotAnimationId) {

        cancelAnimationFrame(
            robotAnimationId
        );

        robotAnimationId = null;
    }

};


/* =========================
   ساخت محیط سه‌بعدی
========================= */

function initRobot() {

    robotStatus.textContent =
        "در حال بارگذاری ربات...";

    robotScene =
        new THREE.Scene();

    robotScene.background =
        new THREE.Color(0x050b15);


    /* دوربین */

    robotCamera =
        new THREE.PerspectiveCamera(
            45,
            1,
            0.1,
            1000
        );

    robotCamera.position.set(
        0,
        1.5,
        4
    );


    /* رندر */

    robotRenderer =
        new THREE.WebGLRenderer({
            canvas: robotCanvas,
            antialias: true,
            alpha: true
        });

    robotRenderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    /* کنترل دوربین */

    robotControls =
        new OrbitControls(
            robotCamera,
            robotRenderer.domElement
        );

    robotControls.enableDamping = true;

    robotControls.target.set(
        0,
        1,
        0
    );


    /* نور */

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x222244,
            2
        );

    robotScene.add(
        ambient
    );


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    light.position.set(
        3,
        5,
        4
    );

    robotScene.add(
        light
    );


    /* نور آبی */

    const blueLight =
        new THREE.PointLight(
            0x00d4ff,
            20,
            10
        );

    blueLight.position.set(
        -2,
        2,
        2
    );

    robotScene.add(
        blueLight
    );


    /* زمین */

    const ground =
        new THREE.Mesh(
            new THREE.CircleGeometry(
                4,
                64
            ),
            new THREE.MeshStandardMaterial({
                color: 0x07111f,
                metalness: .4,
                roughness: .7
            })
        );

    ground.rotation.x =
        -Math.PI / 2;

    ground.position.y = -0.01;

    robotScene.add(
        ground
    );


    /* لود مدل */

    const loader =
        new GLTFLoader();


    loader.load(

        "./rigged-model.glb",

        function(gltf) {

            robotModel =
                gltf.scene;

            robotScene.add(
                robotModel
            );


            /* اندازه مدل */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        robotModel
                    );

            const size =
                box.getSize(
                    new THREE.Vector3()
                );

            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (maxSize > 0) {

                const scale =
                    2.2 / maxSize;

                robotModel.scale.setScalar(
                    scale
                );

            }


            /* مرکز کردن */

            const newBox =
                new THREE.Box3()
                    .setFromObject(
                        robotModel
                    );

            const newCenter =
                newBox.getCenter(
                    new THREE.Vector3()
                );

            robotModel.position.x -=
                newCenter.x;

            robotModel.position.z -=
                newCenter.z;

            robotModel.position.y -=
                newBox.min.y;


            /* انیمیشن */

            if (
                gltf.animations &&
                gltf.animations.length > 0
            ) {

                robotMixer =
                    new THREE.AnimationMixer(
                        robotModel
                    );

                const animations =
                    gltf.animations;

                let selectedAnimation =
                    animations.find(
                        a =>
                            /walk|walking|run|running/i
                                .test(a.name)
                    );


                if (!selectedAnimation) {

                    selectedAnimation =
                        animations[0];

                }


                const action =
                    robotMixer.clipAction(
                        selectedAnimation
                    );

                action.reset();

                action.play();


                robotStatus.textContent =
                    "🤖 ربات آماده است — " +
                    selectedAnimation.name;

            } else {

                robotStatus.textContent =
                    "🤖 مدل لود شد، اما انیمیشنی داخل فایل پیدا نشد.";

            }


            resizeRobot();

        },

        function(progress) {

            if (
                progress.total > 0
            ) {

                const percent =
                    Math.round(
                        progress.loaded /
                        progress.total *
                        100
                    );

                robotStatus.textContent =
                    "در حال بارگذاری ربات... " +
                    percent +
                    "%";
            }

        },

        function(error) {

            console.error(error);

            robotStatus.textContent =
                "❌ مدل پیدا نشد. مطمئن شو rigged-model.glb کنار index.html در GitHub قرار دارد.";

        }

    );


    robotClock =
        new THREE.Clock();


    animateRobot();

    resizeRobot();

}


/* =========================
   اندازه ربات
========================= */

function resizeRobot() {

    if (!robotRenderer)
        return;


    const width =
        robotCanvas.clientWidth;

    const height =
        robotCanvas.clientHeight;


    if (
        width <= 0 ||
        height <= 0
    )
        return;


    robotRenderer.setSize(
        width,
        height,
        false
    );


    robotCamera.aspect =
        width / height;

    robotCamera.updateProjectionMatrix();

}


/* =========================
   انیمیشن ربات
========================= */

function animateRobot() {

    robotAnimationId =
        requestAnimationFrame(
            animateRobot
        );


    if (
        !robotModal.classList.contains(
            "active"
        )
    )
        return;


    const delta =
        robotClock
            ? robotClock.getDelta()
            : 0;


    if (robotMixer) {

        robotMixer.update(
            delta
        );

    }


    if (robotControls) {

        robotControls.update();

    }


    robotRenderer.render(
        robotScene,
        robotCamera
    );

}


/* =========================
   تغییر اندازه صفحه
========================= */

window.addEventListener(
    "resize",
    resizeRobot
);


/* =========================
   بستن با کلیک بیرون
========================= */

robotModal.addEventListener(
    "click",
    function(e) {

        if (
            e.target === robotModal
        ) {

            closeRobot();

        }

    }
);


/* ==========================================================
   FLOWER ANIMATION
========================================================== */

const flowerModal =
    document.getElementById(
        "flowerModal"
    );

const flowerCanvas =
    document.getElementById(
        "flowerCanvas"
    );

const ctx =
    flowerCanvas.getContext(
        "2d"
    );

let flowerAnimationId = null;

let frame = 0;

let running = false;


const petalColors = [

    ["#ff1744", "#ff8a80"],
    ["#ff6d00", "#ffb74d"],
    ["#ffc400", "#fff176"],
    ["#76ff03", "#b9f6ca"],
    ["#00e676", "#69f0ae"],
    ["#00e5ff", "#80deea"],
    ["#2979ff", "#82b1ff"],
    ["#7c4dff", "#b388ff"]

];


function resizeFlowerCanvas() {

    const rect =
        flowerCanvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    flowerCanvas.width =
        rect.width * dpr;

    flowerCanvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


window.openFlower = function() {

    flowerModal.classList.add(
        "active"
    );

    requestAnimationFrame(
        function() {

            resizeFlowerCanvas();

            startFlower();

        }
    );

};


window.closeFlower = function() {

    running = false;

    flowerModal.classList.remove(
        "active"
    );

    if (
        flowerAnimationId !== null
    ) {

        cancelAnimationFrame(
            flowerAnimationId
        );

        flowerAnimationId = null;

    }

};


function easeOut(t) {

    return 1 -
        Math.pow(
            1 - t,
            3
        );

}


function drawPetal(
    cx,
    cy,
    angle,
    length,
    width,
    progress,
    colors
) {

    if (progress <= 0)
        return;


    const p =
        easeOut(
            Math.min(
                progress,
                1
            )
        );


    const L =
        length * p;


    const bend =
        Math.sin(
            p * Math.PI
        ) * 45;


    const dx =
        Math.cos(angle);

    const dy =
        Math.sin(angle);


    const tipX =
        cx +
        dx * L +
        Math.cos(
            angle + Math.PI / 2
        ) * bend;


    const tipY =
        cy +
        dy * L +
        Math.sin(
            angle + Math.PI / 2
        ) * bend;


    const px =
        -Math.sin(angle);

    const py =
        Math.cos(angle);


    const W =
        width * p;


    const leftX =
        cx +
        px * W * .12;

    const leftY =
        cy +
        py * W * .12;


    const rightX =
        cx -
        px * W * .12;

    const rightY =
        cy -
        py * W * .12;


    const midX =
        cx +
        dx * L * .52;

    const midY =
        cy +
        dy * L * .52;


    const sideX =
        px * W * .55;

    const sideY =
        py * W * .55;


    const gradient =
        ctx.createLinearGradient(
            cx,
            cy,
            tipX,
            tipY
        );


    gradient.addColorStop(
        0,
        colors[0]
    );

    gradient.addColorStop(
        .35,
        colors[1]
    );

    gradient.addColorStop(
        .7,
        colors[0]
    );

    gradient.addColorStop(
        1,
        "#180018"
    );


    ctx.beginPath();

    ctx.moveTo(
        leftX,
        leftY
    );


    ctx.bezierCurveTo(

        midX + sideX,
        midY + sideY,

        tipX + px * W * .15,
        tipY + py * W * .15,

        tipX,
        tipY
    );


    ctx.bezierCurveTo(

        tipX - px * W * .15,
        tipY - py * W * .15,

        midX - sideX,
        midY - sideY,

        rightX,
        rightY
    );


    ctx.quadraticCurveTo(
        cx,
        cy,
        leftX,
        leftY
    );


    ctx.closePath();


    ctx.shadowBlur =
        18 * p;

    ctx.shadowColor =
        colors[0];

    ctx.fillStyle =
        gradient;

    ctx.fill();

    ctx.shadowBlur = 0;


    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy
    );

    ctx.quadraticCurveTo(

        midX +
        px * W * .25,

        midY +
        py * W * .25,

        tipX,
        tipY
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.45)";

    ctx.lineWidth =
        Math.max(
            1,
            2 * p
        );

    ctx.stroke();

}


function drawCenter(
    cx,
    cy,
    progress
) {

    const p =
        easeOut(
            Math.min(
                progress,
                1
            )
        );


    const radius =
        10 +
        p * 15;


    const glow =
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            radius * 3
        );


    glow.addColorStop(
        0,
        "#ffffff"
    );

    glow.addColorStop(
        .15,
        "#fff700"
    );

    glow.addColorStop(
        .4,
        "rgba(255,140,0,.7)"
    );

    glow.addColorStop(
        1,
        "rgba(255,50,0,0)"
    );


    ctx.fillStyle =
        glow;


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius * 3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    for (
        let i = 0;
        i < 28;
        i++
    ) {

        const a =
            i *
            Math.PI *
            2 /
            28;


        const r =
            radius * .55;


        const x =
            cx +
            Math.cos(a) * r;


        const y =
            cy +
            Math.sin(a) * r;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2.2,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            i % 2 === 0
            ? "#ffd600"
            : "#ff9100";


        ctx.fill();

    }

}


function startFlower() {

    if (running)
        return;


    running = true;

    frame = 0;


    function animate() {

        if (
            !running ||
            !flowerModal.classList.contains(
                "active"
            )
        ) {

            flowerAnimationId =
                null;

            return;

        }


        const rect =
            flowerCanvas.getBoundingClientRect();


        const cw =
            rect.width;

        const ch =
            rect.height;


        const cx =
            cw / 2;

        const cy =
            ch / 2;


        const dpr =
            window.devicePixelRatio || 1;


        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );


        ctx.clearRect(
            0,
            0,
            cw,
            ch
        );


        const bg =
            ctx.createRadialGradient(
                cx,
                cy,
                0,
                cx,
                cy,
                Math.max(cw,ch) * .7
            );


        bg.addColorStop(
            0,
            "#101d32"
        );

        bg.addColorStop(
            .5,
            "#050b15"
        );

        bg.addColorStop(
            1,
            "#000000"
        );


        ctx.fillStyle =
            bg;


        ctx.fillRect(
            0,
            0,
            cw,
            ch
        );


        const petalCount = 8;


        const length =
            Math.min(
                cw,
                ch
            ) * .34;


        const width =
            Math.min(
                cw,
                ch
            ) * .20;


        for (
            let i = 0;
            i < petalCount;
            i++
        ) {

            const delay =
                i * 22;


            const progress =
                (
                    frame -
                    delay
                ) / 65;


            const angle =
                i *
                Math.PI *
                2 /
                petalCount;


            drawPetal(

                cx,
                cy,

                angle,

                length,

                width,

                Math.max(
                    0,
                    progress
                ),

                petalColors[i]

            );

        }


        const centerProgress =
            Math.max(
                0,
                (frame - 150) / 40
            );


        drawCenter(
            cx,
            cy,
            centerProgress
        );


        if (frame > 150) {

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                const a =
                    i * .9 +
                    frame * .002;


                const r =
                    length *
                    (
                        1.15 +
                        Math.sin(
                            frame * .01 + i
                        ) * .08
                    );


                const x =
                    cx +
                    Math.cos(a) * r;


                const y =
                    cy +
                    Math.sin(a) * r;


                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    1.3,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    "rgba(255,255,255,.55)";


                ctx.fill();

            }

        }


        frame++;


        flowerAnimationId =
            requestAnimationFrame(
                animate
            );

    }


    animate();

}


flowerModal.addEventListener(
    "click",
    function(e) {

        if (
            e.target === flowerModal
        ) {

            closeFlower();

        }

    }
);


document.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Escape") {

            if (
                robotModal.classList.contains(
                    "active"
                )
            ) {

                closeRobot();

            }

            if (
                flowerModal.classList.contains(
                    "active"
                )
            ) {

                closeFlower();

            }

        }

    }
);


window.addEventListener(
    "resize",
    resizeFlowerCanvas
);

</script>

</body>
</html>
